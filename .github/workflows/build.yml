name: Build APK

on:
  push:
    branches: [main, claude/android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk quran-hifz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quran-hifz-apk
          path: quran-hifz.apk

      # A fixed "latest" release so the APK has one stable download link for the phone.
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: حفظ القرآن (آخر نسخة)
          body: حمّل ملف quran-hifz.apk وثبّته على جوال الأندرويد.
          prerelease: false
          make_latest: true
          files: quran-hifz.apk
